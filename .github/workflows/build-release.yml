name: Build and publish release jar

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set executable permission on Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build mod jar
        run: ./gradlew build

      - name: Upload jar as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: motionblur-jar
          path: build/libs/*.jar

      - name: Create GitHub release with jar
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
